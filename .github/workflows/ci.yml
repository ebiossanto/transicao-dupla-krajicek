name: CI/CD - Transição Dupla Krajicek

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx
          
      - name: Run mathematical tests
        run: python -m pytest tests/test_math.py -v
          
      - name: Run API tests with FastAPI
        run: python -m pytest tests/test_api.py -v
          
      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/
          
  lint:
    needs: test
    runs-on: windows-latest
    if: github.event_name != 'pull_request' || github.event.review.state == 'APPROVED'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          
      - name: Lint with flake8
        run: |
          # stop errors if flake8 finds any
          flake8 src tests --count --max-complexity=10 --max-line-length=99
          
  build-docs:
    needs: lint
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Generate documentation status
        run: |
          echo "Documentation folder contents:" && dir /s docs/
          echo "Source code folder contents:" && dir /s src/
          
      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/
          
  deploy:
    needs: build-docs
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Print deployment info
        run: |
          echo "✅ Build e testes passaram com sucesso!"
          echo "📦 Próxima etapa: Deploy manual ou configurar ambiente de produção."
          
      - name: Notify deployment
        run: |
          echo "Workflow concluído com sucesso!"
          echo "Repository: https://github.com/ebiossanto/transicao-dupla-krajicek"
          
  test-api:
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi pytest httpx
          
      - name: Run API integration tests
        run: |
          # Iniciar o servidor em segundo plano
          python src/app.py &
          Sleep 5
          
          # Executar testes de integração
          pytest tests/test_api.py -v
          
          # Finalizar o servidor
          taskkill /f /python.exe > nul 2>&1